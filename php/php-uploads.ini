; Configuration PHP pour les uploads de fichiers
;
; Standard uploads (UploadPhotoController):
;   - upload_max_filesize et post_max_size limités à 100M par chunk
;   - Limite métier définie dans PHOTO_MAX_FILE_SIZE (20MB par défaut)
;
; Tus chunked uploads (TusUploadController):
;   - Chaque chunk fait max 100M (configurable côté client)
;   - Taille finale illimitée côté PHP (limitée par TUS_MAX_UPLOAD_SIZE)
;   - Supporte reprise après interruption

; Taille max d'un fichier uploadé (ou d'un chunk Tus)
upload_max_filesize = 100M

; Taille max des données POST (doit être >= upload_max_filesize)
post_max_size = 105M

; Nombre max de fichiers dans un même formulaire
max_file_uploads = 100

; Timeout illimité pour les longs uploads
max_input_time = 0
max_execution_time = 0
