# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    photo.max_file_size: '%env(int:PHOTO_MAX_FILE_SIZE)%'
    photo.allowed_mime_types: '%env(csv:PHOTO_ALLOWED_MIME_TYPES)%'
    photo.storage_path: '%kernel.project_dir%/var/storage/photos'
    # Tus upload configuration
    tus.upload_dir: '%kernel.project_dir%/var/storage/uploads/tus'
    tus.cache_dir: '%kernel.project_dir%/var/cache/tus'
    tus.max_upload_size: '%env(int:TUS_MAX_UPLOAD_SIZE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Photo Bounded Context - Repository bindings
    App\Photo\Domain\Repository\FolderRepositoryInterface:
        class: App\Photo\Infrastructure\Persistence\Doctrine\Repository\DoctrineFolderRepository

    App\Photo\Domain\Repository\PhotoRepositoryInterface:
        class: App\Photo\Infrastructure\Persistence\Doctrine\Repository\DoctrinePhotoRepository

    # Photo Bounded Context - Storage binding
    App\Photo\Domain\Port\FileStorageInterface:
        class: App\Photo\Infrastructure\Storage\LocalFileSystemStorage
        arguments:
            $storagePath: '%kernel.project_dir%/var/storage/photos'

    # Photo Bounded Context - File validator
    App\Photo\Domain\Service\FileValidator:
        arguments:
            $maxFileSize: '%photo.max_file_size%'
            $allowedMimeTypes: '%photo.allowed_mime_types%'

    # Photo Bounded Context - Query handlers
    # GetPhotoFileHandler now uses FileStorageInterface
    # which is automatically injected by Symfony's autowiring

    # Shared Infrastructure - Process runner for external commands
    App\Shared\Infrastructure\Process\ProcessRunner: ~

    # Photo Bounded Context - Thumbnail strategies (Strategy pattern)
    # Each strategy handles a specific media type (images, videos, PDFs, etc.)
    App\Photo\Domain\Service\ThumbnailStrategy\ImageThumbnailStrategy:
        tags: ['thumbnail.strategy']

    App\Photo\Domain\Service\ThumbnailStrategy\VideoThumbnailStrategy:
        tags: ['thumbnail.strategy']

    # Photo Bounded Context - Thumbnail service (Application service for any storage)
    App\Photo\Application\Service\ThumbnailService:
        arguments:
            $strategies: !tagged_iterator thumbnail.strategy
            $tempDir: '%kernel.project_dir%/var/cache/thumbnails'
            $storagePath: '%kernel.project_dir%/var/storage'

    App\Photo\Application\Port\ThumbnailServiceInterface:
        alias: App\Photo\Application\Service\ThumbnailService

    # Commands
    App\Command\SeedTestDataCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # File Bounded Context - Storage Infrastructure
    App\File\Infrastructure\Storage\StorageDsnParser: ~

    App\File\Infrastructure\Storage\StorageFactory:
        arguments:
            $bridges: !tagged_iterator storage.bridge
            $projectDir: '%kernel.project_dir%'

    App\File\Domain\Port\FileStorageInterface:
        factory: ['@App\File\Infrastructure\Storage\StorageFactory', 'create']
        arguments:
            $dsn: '%env(STORAGE_DSN)%'

    # File Bounded Context - Physical folder storage
    App\File\Domain\Service\PhysicalFolderStorage:
        arguments:
            $basePath: '%kernel.project_dir%/var/storage'

    # Tus Upload - Resumable file uploads
    App\Photo\Infrastructure\Tus\TusServerFactory:
        arguments:
            $uploadDir: '%tus.upload_dir%'
            $cacheDir: '%tus.cache_dir%'
            $maxUploadSize: '%tus.max_upload_size%'

    # Bind the ResumableUploadServerInterface to Tus implementation
    App\Photo\Application\Port\ResumableUploadServerInterface:
        class: App\Photo\Infrastructure\Tus\TusResumableUploadServer

    # Storage bridges are auto-discovered via tagged_iterator 'storage.bridge'
    # External packages (e.g., yggdrasilcloud/storage-s3) must register their
    # own bridges in their bundle configuration or services.yaml
