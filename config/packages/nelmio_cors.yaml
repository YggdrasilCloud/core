nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/uploads/tus':
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_headers:
                - 'Content-Type'
                - 'Authorization'
                - 'Tus-Resumable'
                - 'Upload-Length'
                - 'Upload-Offset'
                - 'Upload-Metadata'
                - 'Upload-Checksum'
                - 'Upload-Concat'
                - 'Upload-Defer-Length'
                - 'Content-Length'
            expose_headers:
                - 'Link'
                - 'Location'
                - 'Tus-Resumable'
                - 'Tus-Version'
                - 'Tus-Extension'
                - 'Tus-Max-Size'
                - 'Upload-Offset'
                - 'Upload-Length'
                - 'Upload-Expires'
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD']
            max_age: 86400
        '^/api':
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_headers: ['Content-Type', 'Authorization']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
            max_age: 3600
